name: Release main on PC

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: 'Dry-run comparison commit (blank = last successful release, or full bootstrap)'
        type: string
        default: ''
  workflow_call:
    inputs:
      base:
        type: string
        default: ''

permissions:
  contents: write
  issues: write

# One whole release, including development, at a time. A newer queued push can
# replace a pending one; the persistent successful-release cursor retains its diff.
concurrency:
  group: revline-main-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'zuraHQ/revline-editor' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: [self-hosted, Linux, X64, revline-deploy-pc]
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_BASE: ${{ inputs.base }}
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and release changed services
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/state/revline-deploy"
          args=()
          if [ "$GITHUB_EVENT_NAME" != push ]; then args+=(--dry-run); fi
          flock "$HOME/.local/state/revline-deploy/release.lock" node scripts/release-main.mjs "${args[@]}"
      - name: Report checkout or runner bootstrap failure
        if: failure()
        shell: bash
        run: |
          # The release script reports the exact step and bounded log tail. This
          # fallback also covers a checkout failure before that script can start.
          marker="$RUNNER_TEMP/revline-release-reported-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ -f "$marker" ]; then exit 0; fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="Release failed during checkout or runner bootstrap, before the release script could report. Step logs: $url"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -f body="$body" >/dev/null || \
            gh issue create --repo "$GITHUB_REPOSITORY" --title 'Release runner bootstrap failed' --body "$body"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            cd "$HOME/Developer/revline-main"
            node node_modules/convex/bin/main.js run discordAlerts:enqueue \
              "{\"source\":\"sentry\",\"eventId\":\"deploy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\",\"title\":\"Revline deployment failed\",\"description\":\"Checkout or runner bootstrap failed. $url\"}" \
              --deployment different-gnu-398
          fi
