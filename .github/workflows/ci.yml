name: Validate
on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Dry-run comparison commit'
        type: string
        default: ''
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2kuY2xlcmsuYWNjb3VudHMuZGV2JA==
      NEXT_PUBLIC_CONVEX_URL: https://ci.convex.cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m venv .data/scene-detection && .data/scene-detection/bin/pip install -r scripts/scene-detection-requirements.txt
      - run: npm ci
      - run: npm run agent-runner:install
      - run: npm run typecheck
      - run: npm run typecheck:agent-runner
      - run: npm run typecheck:processor-edge
      - run: npm run build

  # Dispatch bridge: ci.yml already exists on main, allowing the branch's new
  # reusable release workflow to be exercised before it is merged.
  release-dry-run:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/deploy-main.yml
    with:
      base: ${{ inputs.base }}
