name: Railway staging
on:
  push:
    branches: [main, t3/railway-worker-migration]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: revline-railway-staging
  cancel-in-progress: false
jobs:
  # Railway staging slots deploy themselves from GitHub main (Railway autodeploy), like production; this workflow no
  # longer builds images or stages them. It keeps the persistent staging Convex backend on main.
  stage:
    if: github.repository_id == '1412697447'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.RAILWAY_STAGING_CONVEX_DEPLOY_KEY }}
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy only the persistent staging backend
        run: npx convex deploy --yes
