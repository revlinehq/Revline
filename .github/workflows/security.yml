name: Security
# Runs pull request code, including from forks: GitHub-hosted runners only, never
# the self-hosted release runner. The weekly run catches newly published advisories.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan reachable Git history without disclosing secret values
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact=100 --no-banner --no-color --log-opts="--all" 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          # Gitleaks reports success when Git fails before any commit is read.
          grep -Eq '[1-9][0-9]* commits scanned' "$RUNNER_TEMP/gitleaks.log"
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --prefix cloudflare/agent-runner --omit=dev --audit-level=moderate
